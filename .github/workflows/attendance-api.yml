name: Laravel API and security

on:
  push:
    branches:
      - feature/attendance-api-v1
      - epic/attendance-v1
      - security/laravel-dependencies-v2
  pull_request:
    branches:
      - epic/attendance-v1
      - epic/portfolio-live-demo-v1
      - main
    paths:
      - 'laravel/**'
      - '.github/workflows/attendance-api.yml'

permissions:
  contents: read

concurrency:
  group: laravel-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel audit, tests and Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, intl
          coverage: none

      - name: Verify patched PHP runtime
        run: |
          php -r 'if (version_compare(PHP_VERSION, "8.5.12", "<")) { fwrite(STDERR, "PHP 8.5.12 or newer is required".PHP_EOL); exit(1); } echo PHP_VERSION, PHP_EOL;'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Check attendance code formatting
        run: >-
          vendor/bin/pint --test
          app/Http/Controllers/Attendance/AttendanceController.php
          app/Http/Resources/Attendance/AttendanceRecordResource.php
          app/Models/AttendanceRecord.php
          app/Models/User.php
          database/migrations/2026_10_20_000001_create_attendance_records_table.php
          routes/api.php
          routes/api/attendance.php
          tests/Feature/Attendance/AttendanceApiTest.php

      - name: Run Laravel test suite
        run: php artisan test
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
