name: Ticket CI

on:
  push:
    branches: [main]
    paths: ['react/**', 'laravel/**', '.github/workflows/ticket-ci.yml']
  pull_request:
    paths: ['react/**', 'laravel/**', '.github/workflows/ticket-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Laravel tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --ansi
      - run: composer test
